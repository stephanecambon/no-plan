# S6 — FLAGSHIP d'EN-TÊTE : VRAI iiwa7 (chaîne + corps convexe fidèle GELÉS), portée 7-DOF
# CERTIFIÉE (S10-quater, porte G4'). Cinématique fidèle à l'URDF iiwa7 ~2e-6 (S10-bis) ET
# silhouette convexe fidèle 40 sommets, parité ~1.7e-6 (S10-ter). verify.py SACRÉ — zéro diff.
#
# RÉCIT. Un bras redondant 7-DOF (KUKA iiwa7) doit passer d'une pose basse (épaule pitchée d'un
# côté) à une pose basse symétrique (pitchée de l'autre) ; une ÉTAGÈRE EN SURPLOMB barre le
# passage par le haut. L'intuition dit « un bras à 7 axes, redondant, contournera ». Le certificat
# prouve le contraire : pour changer le SIGNE du pitch d'épaule (q2) il faut passer par q2~0 (bras
# DROIT, vertical), où le SEGMENT PROXIMAL (lien 3) percute l'étagère — et AUCUN des 4 joints
# distaux ne l'en sort (ils sont en aval du lien 3, passifs). Redondance inutile = THÈSE du flagship.
#
# POURQUOI PITCH ET PAS LACET (A43, finding S10-ter). Le vrai lien 3 est un blob COMPACT (~0.13 m),
# sans le levier 0.3 m du segment iiwa-LIKE : le lacet de base ne le bouge pas assez (séparation
# marginale ~6 mm, refusée). Le pitch d'épaule q2 a un GRAND levier en z réel (top du corps 0.81
# bras droit -> 0.55 bras incliné) ⟹ piège FRANC par étagère en surplomb (marge ~90 mm, mesurée).
#
# CORPS = COQUE CONVEXE FIDÈLE (niveau 1) du mesh de visu Drake du lien 3, 40 sommets rationalisés
# (verify recompte en Fraction), frame-chaîne après q3. Dims actives RE-MESURÉES (pair_views) =
# (0,1,2) ; distaux (3,4,5,6) passifs AUTOMATIQUEMENT. Budget (d+1)^3 = 4^3 = 64 lignes/LP.
# Obstacle = étagère H-rep EXACTE (étanche). VÉRITÉ-TERRAIN dense (oracle CORPS-CONVEXE, A43) :
# voir scripts/flagship_iiwa_real_groundtruth.py. Limites box ±70deg actifs / ±143deg passifs (A25).
