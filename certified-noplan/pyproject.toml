[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certified-noplan"
version = "0.1.0"
description = "Certified infeasibility for motion planning (Bernstein-LP disconnection certificates)"
readme = "SPEC.md"
requires-python = ">=3.12,<3.13"
# Dependencies per SPEC §3. Drake is NOT in the critical path of S0 and lives in
# the optional [drake] extra (installed in S1, see JOURNAL.md): the macOS arm64
# wheel is heavy and not needed to reproduce the planar regression suite.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "cvxpy>=1.5",
    "clarabel>=0.6",       # default LP/SDP back-end used by the sandbox campaign
    "highspy>=1.7",        # direct HiGHS LP back-end (used from S8)
    "scikit-learn>=1.4",   # SVM fit for phifit (S5)
    "sympy>=1.12",         # symbolic FK fallback in ratfk (REPLI, SPEC §9.4)
    "pyyaml>=6.0",         # scene parser (S6)
    "matplotlib>=3.8",     # figures (S11)
    "meshcat>=0.3",        # 3D viz (S11)
]

[project.scripts]
cnp = "cnp.cli:main"       # `cnp verify <cert.json>` (S4); certify/show in S6

[project.optional-dependencies]
drake = ["drake>=1.30"]    # RationalForwardKinematics wrapper (S1)
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: slow regression cases (SOS-SDP cross-check at higher n)",
]
# Warnings hygiene (CLAUDE.md S8 "warnings traités"):
#  * the fork DeprecationWarning is RESOLVED at source — the parallel engine now defaults
#    to start_method="forkserver" (S8), which forks workers from a clean single-threaded
#    server, so no fork-from-multithreaded-parent warning is raised (was 20 in S7);
#  * the CLARABEL "Solution may be inaccurate" notice is DOCUMENTED-as-benign and filtered:
#    it comes ONLY from the SOS-SDP / Bernstein cross-check ORACLE in tests/regref.py — a
#    test-only second opinion that CLAUDE.md rule 3 keeps OUT of src/cnp — where CLARABEL
#    solves a poorly-scaled SDP at higher n. The test still asserts the cross-check bound
#    matches the Bernstein-LP to tolerance, so an "inaccurate" (but in-tolerance) interior
#    solution does not weaken anything. The product LP path (HiGHS/highspy) never uses it.
filterwarnings = [
    "ignore:Solution may be inaccurate:UserWarning",
]
